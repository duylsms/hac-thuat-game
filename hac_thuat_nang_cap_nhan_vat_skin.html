<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Hắc Thuật — Đại Chiến Phù Thủy</title>
<style>
:root{color-scheme:dark;--gold:#d7b56d;--ink:#080b12;--panel:#101722}
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#080b12;color:#f4f0e8;font-family:Georgia,'Times New Roman',serif;touch-action:none}
#game{display:block;width:100vw;height:100dvh;background:#080b12}
.hud{position:fixed;inset:0;pointer-events:none;padding:12px;display:flex;flex-direction:column;justify-content:space-between}
.top{display:flex;justify-content:space-between;gap:12px;align-items:flex-start}
.brand{font-size:clamp(17px,4vw,25px);letter-spacing:.13em;color:var(--gold);text-shadow:0 0 16px #a42d40}
.sub{font:10px system-ui,sans-serif;letter-spacing:.22em;color:#a7acba;margin-top:3px}
.bars{width:min(42vw,260px);font:11px system-ui,sans-serif;text-transform:uppercase;letter-spacing:.12em}
.label{display:flex;justify-content:space-between;margin:2px 0 5px}
.track{height:10px;background:#27232c;border:1px solid #62504b;border-radius:8px;overflow:hidden;margin-bottom:7px}
.fill{height:100%;width:100%;transition:width .12s;background:linear-gradient(90deg,#8f152b,#e3545c)}
#manaFill{background:linear-gradient(90deg,#174a81,#5ccef3)}
#enemyFill{background:linear-gradient(90deg,#741b2a,#d95757)}
.centerMsg{position:absolute;left:50%;top:43%;transform:translate(-50%,-50%);text-align:center;width:90%;text-shadow:0 2px 8px #000}
.centerMsg h1{font-size:clamp(25px,6vw,48px);color:var(--gold);margin:0 0 8px;letter-spacing:.1em}
.centerMsg p{font:13px/1.5 system-ui,sans-serif;color:#d6d5df;margin:0 auto;max-width:420px}
.skinPicker{display:flex;flex-wrap:wrap;justify-content:center;gap:7px;margin:13px auto 2px;max-width:390px}.skinBtn{padding:8px 10px;border-radius:7px;font-size:10px;letter-spacing:.04em}.skinBtn.selected{border-color:#f5d58a;box-shadow:0 0 12px #e8b85b66;background:linear-gradient(145deg,#4b3925,#17131c)}
.bottom{display:flex;align-items:flex-end;justify-content:space-between;gap:10px}
.hint{font:11px/1.5 system-ui,sans-serif;color:#c2c4cc;max-width:150px;text-shadow:0 1px 4px #000}
.controls{display:flex;gap:9px;align-items:flex-end;pointer-events:auto}
.pad{display:grid;grid-template-columns:repeat(3,42px);grid-template-rows:repeat(2,42px);gap:4px}
button{border:1px solid #78654a;background:linear-gradient(145deg,#222532eF,#0b0d15f2);color:#f5e9cc;border-radius:12px;font:12px system-ui,sans-serif;box-shadow:0 4px 14px #0008;touch-action:none;user-select:none;-webkit-user-select:none}
button:active,button.active{background:#513344;border-color:#e0b46c;transform:scale(.97)}
.pad button{font-size:18px}
.actions{display:grid;grid-template-columns:repeat(2,58px);gap:6px}
.actions button{height:45px;font-size:10px;letter-spacing:.04em}
.actions .spell{border-color:#9d4356;background:linear-gradient(145deg,#421b2b,#170f1c)}
.actions .shield{border-color:#4c9eb8;background:linear-gradient(145deg,#163e50,#101a2b)}
#startBtn{pointer-events:auto;margin-top:14px;padding:13px 24px;border-radius:3px;border:1px solid var(--gold);background:#17131c;color:var(--gold);font-weight:bold;letter-spacing:.16em}
.overlay{pointer-events:auto}
@media(min-width:760px){.pad{grid-template-columns:repeat(3,52px);grid-template-rows:repeat(2,52px)}.actions{grid-template-columns:repeat(2,70px)}.actions button{height:52px}.hint{max-width:230px;font-size:13px}}
</style>
</head>
<body>
<canvas id="game"></canvas>
<div class="hud">
 <div class="top">
  <div><div class="brand">HẮC THUẬT</div><div class="sub">ĐẠI CHIẾN PHÙ THỦY</div></div>
  <div class="bars">
   <div class="label"><span>PHÙ THỦY ÁNH SÁNG</span><span id="hpText">100</span></div><div class="track"><div class="fill" id="hpFill"></div></div>
   <div class="label"><span>NĂNG LƯỢNG</span><span id="manaText">100</span></div><div class="track"><div class="fill" id="manaFill"></div></div>
   <div class="label"><span>PHÙ THỦY HẮC ÁM</span><span id="enemyText">100</span></div><div class="track"><div class="fill" id="enemyFill"></div></div>
  </div>
 </div>
 <div class="centerMsg overlay" id="intro">
  <h1>ĐẤU TRƯỜNG BÓNG TỐI</h1>
  <p>Đối đầu với pháp sư hắc ám trong tàn tích cổ. Chọn diện mạo phù thủy của bạn rồi bước vào đấu trường.</p>
  <div class="skinPicker" id="skinPicker"><button class="skinBtn selected" data-skin="auror">✦ HỘ VỆ</button><button class="skinBtn" data-skin="moon">☾ NGUYỆT ẢNH</button><button class="skinBtn" data-skin="ember">🔥 HỎA ẤN</button><button class="skinBtn" data-skin="forest">❖ LỤC MỘC</button></div>
  <button id="startBtn">BẮT ĐẦU TRẬN ĐẤU</button>
 </div>
 <div class="bottom">
  <div class="hint" id="status">Di chuyển để né tia phép.<br>Đánh bại đối thủ để giành chiến thắng.</div>
  <div class="controls">
   <div class="pad">
    <span></span><button data-move="up">↑</button><span></span>
    <button data-move="left">←</button><button data-move="down">↓</button><button data-move="right">→</button>
   </div>
   <div class="actions">
    <button class="spell" id="cast">✦ TIA PHÉP</button>
    <button class="shield" id="shield">◈ KHIÊN</button>
    <button id="burst">✹ BÙNG NỔ</button>
    <button id="restart">↻ CHƠI LẠI</button>
   </div>
  </div>
</div>
<script>
(()=> {
const canvas=document.getElementById('game'),ctx=canvas.getContext('2d');
let W=innerWidth,H=innerHeight,dpr=1;
function resize(){dpr=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;canvas.width=W*dpr;canvas.height=H*dpr;canvas.style.width=W+'px';canvas.style.height=H+'px';ctx.setTransform(dpr,0,0,dpr,0,0)}
addEventListener('resize',resize);resize();
const el=id=>document.getElementById(id);
let running=false,over=false,player,enemy,shots=[],particles=[],keys={},last=0,enemyTimer=0,castCooldown=0,burstCooldown=0,shake=0,skin='auror';
const skins={auror:{cloak:'#202d42',edge:'#78c8e8',robe:'#344d68',hair:'#3b2b24',hat:'#142033',glow:'#7be8ff',trim:'#d6bd7a'},moon:{cloak:'#28203e',edge:'#b6a1ff',robe:'#51417b',hair:'#d9d5e8',hat:'#171329',glow:'#c4a7ff',trim:'#e8dcff'},ember:{cloak:'#3b1b25',edge:'#ff835e',robe:'#792b32',hair:'#8e3b24',hat:'#241019',glow:'#ff6a47',trim:'#f6c06a'},forest:{cloak:'#142c2b',edge:'#70d6a3',robe:'#205145',hair:'#5c3824',hat:'#10201d',glow:'#72ffb4',trim:'#d4d887'}};
const arena=()=>({l:W*.09,r:W*.91,t:H*.19,b:H*.78});
function reset(){player={x:W*.28,y:H*.57,hp:100,mana:100,shield:0,inv:0};enemy={x:W*.72,y:H*.48,hp:100,shield:0,inv:0};shots=[];particles=[];enemyTimer=.8;castCooldown=0;burstCooldown=0;over=false;running=true;el('intro').style.display='none';el('status').innerHTML='Né phép và phản công!<br>Tia phép: 8 năng lượng · Bùng nổ: 30';updateHud()}
function bindStart(){const b=el('startBtn');if(!b)return;b.onclick=reset;b.ontouchend=e=>{e.preventDefault();reset()};b.onpointerup=e=>{if(e.pointerType==='touch'){e.preventDefault();reset()}}}
bindStart();el('restart').addEventListener('click',reset);
document.querySelectorAll('[data-skin]').forEach(b=>b.addEventListener('click',()=>{skin=b.dataset.skin;document.querySelectorAll('[data-skin]').forEach(x=>x.classList.toggle('selected',x===b))}));
const held=new Set();
document.querySelectorAll('[data-move]').forEach(b=>{
 const k=b.dataset.move;
 const down=e=>{e.preventDefault();held.add(k);b.classList.add('active')};
 const up=e=>{e.preventDefault();held.delete(k);b.classList.remove('active')};
 b.addEventListener('pointerdown',down);b.addEventListener('pointerup',up);b.addEventListener('pointercancel',up);b.addEventListener('pointerleave',up);
});
function action(id,fn){const b=el(id);b.addEventListener('pointerdown',e=>{e.preventDefault();if(running&&!over)fn();b.classList.add('active')});['pointerup','pointercancel','pointerleave'].forEach(t=>b.addEventListener(t,()=>b.classList.remove('active')))}
action('cast',()=>cast());action('shield',()=>{if(player.mana>=10){player.mana-=10;player.shield=.75;burst(player.x,player.y,'#68d8ff',18)}});
action('burst',()=>{if(player.mana>=30&&burstCooldown<=0){player.mana-=30;burstCooldown=4;let dx=enemy.x-player.x,dy=enemy.y-player.y;for(let i=0;i<3;i++)shots.push({x:player.x,y:player.y,tx:enemy.x+(Math.random()-.5)*35,ty:enemy.y+(Math.random()-.5)*35,speed:500,damage:13,owner:'p',color:'#f7d27c',radius:7});burst(player.x,player.y,'#e7bb6a',35)}});
function cast(){if(player.mana<8||castCooldown>0)return;player.mana-=8;castCooldown=.22;shots.push({x:player.x,y:player.y,tx:enemy.x,ty:enemy.y,speed:470,damage:8,owner:'p',color:'#8be9ff',radius:5})}
function burst(x,y,color,n){for(let i=0;i<n;i++){let a=Math.random()*Math.PI*2,s=35+Math.random()*190;particles.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,life:.25+Math.random()*.5,max:.75,color,r:1+Math.random()*3})}}
function updateHud(){el('hpFill').style.width=player.hp+'%';el('hpText').textContent=Math.ceil(player.hp);el('manaFill').style.width=player.mana+'%';el('manaText').textContent=Math.ceil(player.mana);el('enemyFill').style.width=enemy.hp+'%';el('enemyText').textContent=Math.ceil(enemy.hp)}
function drawBackground(t){
 ctx.fillStyle='#080b12';ctx.fillRect(0,0,W,H);
 let g=ctx.createRadialGradient(W*.5,H*.4,10,W*.5,H*.45,Math.max(W,H)*.75);g.addColorStop(0,'#25202e');g.addColorStop(.55,'#111521');g.addColorStop(1,'#05070c');ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
 // Gothic arches and ruined pillars
 for(let i=0;i<7;i++){let x=i*W/6;ctx.strokeStyle='#34313d';ctx.lineWidth=3;ctx.beginPath();ctx.moveTo(x,H*.2);ctx.lineTo(x,H*.73);ctx.stroke();ctx.beginPath();ctx.arc(x,H*.23,W*.07,Math.PI,0);ctx.stroke();ctx.fillStyle='#161823';ctx.fillRect(x-9,H*.22,18,H*.51)}
 const a=arena();ctx.save();ctx.translate(W*.5,H*.52);ctx.scale(1,.46);ctx.strokeStyle='#5d4c54';ctx.lineWidth=2;for(let i=0;i<5;i++){ctx.beginPath();ctx.ellipse(0,0,W*(.14+i*.105),H*(.13+i*.09),0,0,Math.PI*2);ctx.stroke()}ctx.restore();
 // rune marks
 for(let i=0;i<13;i++){let x=(i*173+47)%W,y=H*(.25+((i*71)%45)/100);ctx.strokeStyle=`rgba(180,95,121,${.15+.08*Math.sin(t*2+i)})`;ctx.lineWidth=1;ctx.beginPath();ctx.arc(x,y,5+(i%3)*3,0,Math.PI*2);ctx.moveTo(x-7,y);ctx.lineTo(x+7,y);ctx.moveTo(x,y-7);ctx.lineTo(x,y+7);ctx.stroke()}
 // floor perspective
 ctx.strokeStyle='#282735';ctx.lineWidth=1;for(let i=0;i<9;i++){let y=H*.57+i*i*H*.003;ctx.beginPath();ctx.moveTo(W*.08,y);ctx.lineTo(W*.92,y);ctx.stroke()}
}
function wizard(o,kind,t){
 const s=Math.max(.7,Math.min(1.3,H/650)),x=o.x,y=o.y;
 const isPlayer=kind==='p',look=isPlayer?skins[skin]:{cloak:'#25101a',edge:'#e34d68',robe:'#571a2b',hair:'#171016',hat:'#170b12',glow:'#ff315b',trim:'#d85c72'};
 const bob=Math.sin(t*3+(isPlayer?0:1))*1.5*s,casting=(running&&((isPlayer&&castCooldown>.12)||(!isPlayer&&enemyTimer<.18)));
 ctx.save();ctx.translate(x,y+bob);
 // Ground shadow and magical circle
 ctx.fillStyle='#0009';ctx.beginPath();ctx.ellipse(0,22*s,28*s,9*s,0,0,Math.PI*2);ctx.fill();
 ctx.strokeStyle=look.glow+'55';ctx.lineWidth=1.2;ctx.beginPath();ctx.ellipse(0,21*s,28*s,7*s,0,0,Math.PI*2);ctx.stroke();
 // Flowing cloak with layered panels
 ctx.fillStyle=look.cloak;ctx.beginPath();ctx.moveTo(-12*s,-9*s);ctx.quadraticCurveTo(-18*s,5*s,-28*s,27*s);ctx.quadraticCurveTo(-5*s,32*s,0,26*s);ctx.quadraticCurveTo(8*s,33*s,28*s,26*s);ctx.lineTo(12*s,-9*s);ctx.closePath();ctx.fill();
 ctx.fillStyle=look.robe;ctx.beginPath();ctx.moveTo(-7*s,-7*s);ctx.lineTo(-10*s,25*s);ctx.lineTo(0,28*s);ctx.lineTo(9*s,25*s);ctx.lineTo(7*s,-7*s);ctx.closePath();ctx.fill();
 // Gold / skin-specific embroidered trim
 ctx.strokeStyle=look.edge;ctx.lineWidth=2*s;ctx.beginPath();ctx.moveTo(-12*s,-7*s);ctx.quadraticCurveTo(-18*s,12*s,-25*s,26*s);ctx.moveTo(12*s,-7*s);ctx.quadraticCurveTo(18*s,12*s,25*s,26*s);ctx.stroke();
 ctx.strokeStyle=look.trim;ctx.lineWidth=1*s;ctx.beginPath();ctx.moveTo(-5*s,2*s);ctx.lineTo(-3*s,22*s);ctx.moveTo(5*s,2*s);ctx.lineTo(3*s,22*s);ctx.stroke();
 // Collar and shoulders
 ctx.fillStyle=look.cloak;ctx.beginPath();ctx.moveTo(-13*s,-10*s);ctx.lineTo(-8*s,-19*s);ctx.lineTo(0,-11*s);ctx.lineTo(8*s,-19*s);ctx.lineTo(13*s,-10*s);ctx.lineTo(6*s,-3*s);ctx.lineTo(-6*s,-3*s);ctx.closePath();ctx.fill();
 // Face, ears, hair and expressive eyes
 ctx.fillStyle='#d9b49a';ctx.beginPath();ctx.ellipse(0,-19*s,8.5*s,10.5*s,0,0,Math.PI*2);ctx.fill();
 ctx.fillStyle=isPlayer?(skin==='moon'?'#ddd9e8':skin==='ember'?'#9a4d2b':skin==='forest'?'#4b2e21':'#3b2b24'):'#171016';
 ctx.beginPath();ctx.moveTo(-8*s,-22*s);ctx.quadraticCurveTo(-10*s,-33*s,0,-31*s);ctx.quadraticCurveTo(10*s,-31*s,8*s,-21*s);ctx.lineTo(4*s,-24*s);ctx.lineTo(0,-21*s);ctx.lineTo(-4*s,-24*s);ctx.closePath();ctx.fill();
 ctx.fillStyle='#241c25';ctx.fillRect(-5.5*s,-19*s,3*s,1.4*s);ctx.fillRect(2.5*s,-19*s,3*s,1.4*s);
 ctx.strokeStyle='#875e52';ctx.lineWidth=.8*s;ctx.beginPath();ctx.moveTo(-2*s,-13*s);ctx.lineTo(2*s,-13*s);ctx.stroke();
 // Distinctive pointed hat with band and glowing emblem
 ctx.fillStyle=look.hat;ctx.beginPath();ctx.moveTo(-13*s,-25*s);ctx.lineTo(-5*s,-37*s);ctx.quadraticCurveTo(4*s,-43*s,9*s,-35*s);ctx.lineTo(13*s,-25*s);ctx.closePath();ctx.fill();
 ctx.fillStyle=look.edge;ctx.beginPath();ctx.moveTo(-13*s,-25*s);ctx.quadraticCurveTo(0,-29*s,13*s,-25*s);ctx.lineTo(12*s,-22*s);ctx.quadraticCurveTo(0,-25*s,-12*s,-22*s);ctx.closePath();ctx.fill();
 ctx.strokeStyle=look.trim;ctx.lineWidth=1.2*s;ctx.beginPath();ctx.moveTo(0,-34*s);ctx.lineTo(0,-29*s);ctx.stroke();
 // Arms and wand angled forward
 ctx.strokeStyle=look.cloak;ctx.lineWidth=5*s;ctx.lineCap='round';ctx.beginPath();ctx.moveTo(-8*s,-7*s);ctx.lineTo(-14*s,3*s);ctx.moveTo(8*s,-7*s);ctx.lineTo(15*s,-2*s);ctx.stroke();
 ctx.strokeStyle='#b88b5d';ctx.lineWidth=2.5*s;ctx.beginPath();ctx.moveTo(14*s,-2*s);ctx.lineTo(29*s,-17*s);ctx.stroke();
 ctx.fillStyle=look.glow;ctx.shadowColor=look.glow;ctx.shadowBlur=casting?20:7;ctx.beginPath();ctx.arc(29*s,-17*s,casting?4*s:2.5*s,0,Math.PI*2);ctx.fill();ctx.shadowBlur=0;
 // Animated house / faction sigil on chest
 ctx.fillStyle=look.trim;ctx.beginPath();ctx.moveTo(0,-5*s);ctx.lineTo(4*s,0);ctx.lineTo(0,5*s);ctx.lineTo(-4*s,0);ctx.closePath();ctx.fill();
 if(o.shield>0){ctx.strokeStyle=look.glow;ctx.lineWidth=3;ctx.shadowBlur=18;ctx.shadowColor=look.glow;ctx.beginPath();ctx.ellipse(0,-4*s,34*s,42*s,0,0,Math.PI*2);ctx.stroke();ctx.shadowBlur=0}
 if(o.inv>0){ctx.globalAlpha=.5+.5*Math.sin(t*35)}
 ctx.restore();
}
function finish(win){over=true;running=false;el('intro').style.display='block';el('intro').innerHTML=`<h1>${win?'CHIẾN THẮNG!':'BẠN ĐÃ GỤC NGÃ'}</h1><p>${win?'Pháp sư hắc ám đã bị đánh bại. Đấu trường tạm thời được giải cứu.':'Bóng tối đã chiến thắng lần này. Hãy luyện phép và thử lại!'}</p><button id="startBtn">ĐẤU LẠI</button>`;bindStart()}
function update(dt,t){
 if(!running||over)return;
 const a=arena(),speed=210;
 let dx=(held.has('right')?1:0)-(held.has('left')?1:0),dy=(held.has('down')?1:0)-(held.has('up')?1:0);
 if(keys.ArrowRight||keys.d)dx++;if(keys.ArrowLeft||keys.a)dx--;if(keys.ArrowDown||keys.s)dy++;if(keys.ArrowUp||keys.w)dy--;
 let m=Math.hypot(dx,dy)||1;player.x+=dx/m*speed*dt;player.y+=dy/m*speed*dt;
 player.x=Math.max(a.l,Math.min(a.r,player.x));player.y=Math.max(a.t,Math.min(a.b,player.y));
 player.mana=Math.min(100,player.mana+10*dt);player.shield=Math.max(0,player.shield-dt);player.inv=Math.max(0,player.inv-dt);enemy.inv=Math.max(0,enemy.inv-dt);castCooldown=Math.max(0,castCooldown-dt);burstCooldown=Math.max(0,burstCooldown-dt);
 // enemy stalks, with brief pauses
 enemyTimer-=dt;let ex=player.x-enemy.x,ey=player.y-enemy.y,dist=Math.hypot(ex,ey)||1;
 if(dist>Math.min(W,H)*.25){enemy.x+=ex/dist*45*dt;enemy.y+=ey/dist*35*dt}
 enemy.x=Math.max(a.l,Math.min(a.r,enemy.x));enemy.y=Math.max(a.t,Math.min(a.b,enemy.y));
 if(enemyTimer<=0){enemyTimer=1.15+Math.random()*.65;shots.push({x:enemy.x,y:enemy.y,tx:player.x+(Math.random()-.5)*45,ty:player.y+(Math.random()-.5)*45,speed:235,damage:10,owner:'e',color:'#ff476b',radius:6});burst(enemy.x,enemy.y,'#a82b51',7)}
 for(let i=shots.length-1;i>=0;i--){let q=shots[i],vx=q.tx-q.x,vy=q.ty-q.y,d=Math.hypot(vx,vy)||1,step=q.speed*dt;q.x+=vx/d*step;q.y+=vy/d*step;
 let target=q.owner==='p'?enemy:player;
 if(Math.hypot(target.x-q.x,target.y-q.y)<(q.owner==='p'?23:25)){if(q.owner==='p'){target.hp=Math.max(0,target.hp-q.damage);target.inv=.12;burst(q.x,q.y,q.color,12)}else if(player.shield<=0&&player.inv<=0){target.hp=Math.max(0,target.hp-q.damage);target.inv=.45;shake=5;burst(q.x,q.y,q.color,14)}else burst(q.x,q.y,'#6ddfff',8);shots.splice(i,1);continue}
 if(d<step+3||q.x<0||q.x>W||q.y<0||q.y>H)shots.splice(i,1)}
 for(let i=particles.length-1;i>=0;i--){let p=particles[i];p.x+=p.vx*dt;p.y+=p.vy*dt;p.vx*=.97;p.vy*=.97;p.life-=dt;if(p.life<=0)particles.splice(i,1)}
 shake=Math.max(0,shake-dt*20);updateHud();
 if(enemy.hp<=0)finish(true);else if(player.hp<=0)finish(false);
}
function render(t){
 drawBackground(t);
 if(player&&enemy){
 ctx.save();if(shake)ctx.translate((Math.random()-.5)*shake,(Math.random()-.5)*shake);
 shots.forEach(q=>{ctx.save();ctx.strokeStyle=q.color;ctx.fillStyle=q.color;ctx.shadowColor=q.color;ctx.shadowBlur=18;ctx.lineWidth=4;ctx.beginPath();ctx.moveTo(q.x,q.y);ctx.lineTo(q.x-(q.tx-q.x)*.05,q.y-(q.ty-q.y)*.05);ctx.stroke();ctx.beginPath();ctx.arc(q.x,q.y,q.radius,0,Math.PI*2);ctx.fill();ctx.restore()});
 wizard(player,'p',t);wizard(enemy,'e',t);
 particles.forEach(p=>{ctx.globalAlpha=Math.max(0,p.life/p.max);ctx.fillStyle=p.color;ctx.shadowBlur=10;ctx.shadowColor=p.color;ctx.beginPath();ctx.arc(p.x,p.y,p.r,0,Math.PI*2);ctx.fill();ctx.shadowBlur=0});ctx.globalAlpha=1;ctx.restore();
 }else{
 // silhouettes for title screen
 wizard({x:W*.32,y:H*.59,shield:0},'p',t);wizard({x:W*.68,y:H*.53,shield:0},'e',t);
 }
 requestAnimationFrame(render);
}
addEventListener('keydown',e=>{keys[e.key]=true;if(e.key===' '){e.preventDefault();cast()}if(e.key==='Shift'&&player&&player.mana>=10){player.mana-=10;player.shield=.75}});
addEventListener('keyup',e=>keys[e.key]=false);
